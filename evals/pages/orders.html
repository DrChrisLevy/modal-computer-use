<label>Total to refund <input id="amount"></label>
<button id="refund">Issue refund</button>
<p id="message"></p>
<script>
  document.getElementById("refund").onclick = () => {
    const amount = document.getElementById("amount").value.replace(/[$,\s]/g, "");
    window.passed = Number(amount) === 318.4;
    document.getElementById("message").textContent = `Refund of $${amount} submitted.`;
  };
</script>
